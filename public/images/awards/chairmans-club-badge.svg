<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="deepNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051C30" />
      <stop offset="100%" stop-color="#0B3B60" />
    </linearGradient>
  </defs>

  <!-- Outer Seal with Scalloped Edge Illusion -->
  <circle cx="120" cy="120" r="114" fill="url(#deepNavy)" stroke="url(#goldRibbon)" stroke-width="6"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- LIC Flame Crown / Crest at top -->
  <g transform="translate(120, 52)">
    <path d="M0 -14 C-4 -6, -8 0, -8 6 C-8 11, -4 14, 0 14 C4 14, 8 11, 8 6 C8 0, 4 -6, 0 -14 Z" fill="#F59E0B"/>
    <path d="M0 -8 C-2 -3, -4 1, -4 5 C-4 8, -2 10, 0 10 C2 10, 4 8, 4 5 C4 1, 2 -3, 0 -8 Z" fill="#FEF3C7"/>
    <!-- Small laurel leaves -->
    <path d="M-12 10 C-18 6, -22 -2, -18 -8" stroke="#FDE68A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M12 10 C18 6, 22 -2, 18 -8" stroke="#FDE68A" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- LIC Name -->
  <text x="120" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FDE68A" letter-spacing="2">
    LIC OF INDIA
  </text>

  <!-- Chairman's Club Header -->
  <text x="120" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    CHAIRMAN’S CLUB
  </text>
  
  <text x="120" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#F59E0B" letter-spacing="2">
    MEMBER FOR AGENTS
  </text>

  <!-- Distinction Tag -->
  <rect x="50" y="160" width="140" height="22" rx="11" fill="#154673" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="120" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FEF3C7" letter-spacing="0.8">
    ELITE CLUB OF EXCELLENCE
  </text>

  <!-- Bottom Arch -->
  <path d="M75 198 Q120 216 165 198" stroke="url(#goldRibbon)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
